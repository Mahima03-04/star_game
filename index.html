<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#101b19">
	<title>Starfall — Night Shift</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

		:root {
			color-scheme: dark;
			--ink: #101b19;
			--panel: #172522;
			--line: #33433c;
			--paper: #f2eedf;
			--muted: #a2aea0;
			--lime: #d6f36a;
			--coral: #ff8064;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px 20px;
			overflow-x: hidden;
			color: var(--paper);
			background-color: var(--ink);
			background-image: radial-gradient(ellipse at 50% 0%, #293b31 0%, transparent 52%),
				linear-gradient(135deg, transparent 48%, #20302a 48.1%, transparent 48.4%);
			font-family: 'Space Grotesk', 'Trebuchet MS', sans-serif;
		}

		.game { width: min(100%, 900px); }

		.masthead {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 18px;
		}

		.eyebrow, .stat-label, .edition, .control-label {
			font-family: 'DM Mono', monospace;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.eyebrow { margin: 0 0 5px; color: var(--lime); font-size: 11px; }
		h1 { margin: 0; font-size: clamp(30px, 6vw, 49px); line-height: 0.98; letter-spacing: 0; }
		.edition { color: var(--muted); font-size: 10px; white-space: nowrap; }

		.console {
			overflow: hidden;
			border: 1px solid #405148;
			border-radius: 8px;
			background: var(--panel);
			box-shadow: 0 24px 80px #0006, 0 2px 0 #ffffff0a inset;
		}

		.scorebar {
			display: grid;
			grid-template-columns: repeat(4, 1fr) auto;
			align-items: center;
			min-height: 76px;
			padding: 12px 20px;
			border-bottom: 1px solid var(--line);
		}

		.stat { display: grid; gap: 3px; }
		.stat-label { color: var(--muted); font-size: 9px; }
		.stat-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
		#lives { color: var(--coral); letter-spacing: 2px; font-size: 16px; }

		button {
			color: var(--paper);
			font: inherit;
			cursor: pointer;
		}

		.icon-button {
			display: grid;
			place-items: center;
			width: 42px;
			height: 42px;
			border: 1px solid var(--line);
			border-radius: 5px;
			background: transparent;
			font-size: 17px;
		}

		.icon-button:hover:not(:disabled) { border-color: var(--lime); color: var(--lime); }
		.icon-button:disabled { opacity: 0.35; cursor: default; }

		.stage {
			position: relative;
			background: #172622;
			aspect-ratio: 5 / 3;
			min-height: 240px;
		}

		canvas { display: block; width: 100%; height: 100%; }

		.overlay {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			padding: 20px;
			text-align: center;
			background: #101b19a8;
			backdrop-filter: blur(3px);
		}

		.overlay[hidden] { display: none; }
		.overlay-inner { animation: arrive 420ms cubic-bezier(.2,.8,.2,1) both; }
		.overlay-kicker { margin: 0 0 8px; color: var(--lime); font: 11px 'DM Mono', monospace; letter-spacing: 2px; text-transform: uppercase; }
		.overlay h2 { margin: 0; font-size: clamp(35px, 8vw, 65px); line-height: 0.95; }
		.overlay-copy { margin: 10px 0 20px; color: #d0d6c9; font-size: 14px; }

		.play-button {
			min-width: 142px;
			padding: 13px 22px;
			border: 0;
			border-radius: 4px;
			background: var(--lime);
			color: #172119;
			font-size: 13px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 1px;
			transition: transform 150ms ease, background 150ms ease;
		}

		.play-button:hover { transform: translateY(-2px); background: #e4ff8a; }
		.play-button:focus-visible, button:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }

		.footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			min-height: 62px;
			padding: 10px 20px;
			border-top: 1px solid var(--line);
		}

		.control-label { color: var(--muted); font-size: 9px; }
		.keys { display: flex; align-items: center; gap: 5px; }
		kbd {
			display: inline-grid;
			min-width: 27px;
			height: 27px;
			place-items: center;
			padding: 0 6px;
			border: 1px solid #46574d;
			border-radius: 4px;
			background: #202f29;
			color: var(--paper);
			font: 11px 'DM Mono', monospace;
		}

		.mobile-controls { display: none; gap: 10px; }
		.mobile-controls button { width: 54px; height: 44px; border: 1px solid var(--line); border-radius: 5px; background: #202f29; font-size: 19px; touch-action: none; }
		.mobile-controls button:active { border-color: var(--lime); color: var(--lime); }

		@keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

		@media (max-width: 560px) {
			body { padding: 22px 12px; }
			.masthead { margin-bottom: 14px; }
			.edition { font-size: 8px; }
			.scorebar { min-height: 67px; padding: 10px 12px; }
			.stat-value { font-size: 19px; }
			.icon-button { width: 38px; height: 38px; }
			.stage { aspect-ratio: 4 / 3; }
			.footer { padding: 10px 12px; }
			.keys { display: none; }
			.mobile-controls { display: flex; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main class="game">
		<header class="masthead">
			<div>
				<p class="eyebrow">Night shift · arcade no. 01</p>
				<h1>Starfall</h1>
			</div>
			<span class="edition">FIELD NOTES &nbsp; / &nbsp; 001</span>
		</header>

		<section class="console" aria-label="Starfall game">
			<div class="scorebar" aria-live="polite">
				<div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">000</span></div>
				<div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">000</span></div>
				<div class="stat"><span class="stat-label">Hull</span><span class="stat-value" id="lives">♥ ♥ ♥</span></div>
				<div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="time">60</span></div>
				<button class="icon-button" id="pause" type="button" aria-label="Pause game" title="Pause game" disabled>Ⅱ</button>
			</div>

			<div class="stage">
				<canvas id="game-canvas" aria-label="Game field. Move your ship to catch stars and avoid comets."></canvas>
				<div class="overlay" id="overlay">
					<div class="overlay-inner">
						<p class="overlay-kicker" id="overlay-kicker">A little cosmic detour</p>
						<h2 id="overlay-title">Ready?</h2>
						<p class="overlay-copy" id="overlay-copy">Catch the stars. Keep your hull in one piece.</p>
						<button class="play-button" id="start" type="button">Start game <span aria-hidden="true">↗</span></button>
					</div>
				</div>
			</div>

			<footer class="footer">
				<div class="keys" aria-label="Keyboard controls"><span class="control-label">Move</span><kbd>←</kbd><kbd>→</kbd><kbd>A</kbd><kbd>D</kbd></div>
				<span class="control-label">One minute in the meteor field</span>
				<div class="mobile-controls" aria-label="Touch controls">
					<button type="button" data-dir="-1" aria-label="Move left">←</button>
					<button type="button" data-dir="1" aria-label="Move right">→</button>
				</div>
			</footer>
		</section>
	</main>

	<script>
		(() => {
			const canvas = document.querySelector('#game-canvas');
			const ctx = canvas.getContext('2d');
			const stage = canvas.parentElement;
			const overlay = document.querySelector('#overlay');
			const startButton = document.querySelector('#start');
			const pauseButton = document.querySelector('#pause');
			const scoreDisplay = document.querySelector('#score');
			const bestDisplay = document.querySelector('#best');
			const livesDisplay = document.querySelector('#lives');
			const timeDisplay = document.querySelector('#time');
			const overlayKicker = document.querySelector('#overlay-kicker');
			const overlayTitle = document.querySelector('#overlay-title');
			const overlayCopy = document.querySelector('#overlay-copy');
			const width = 800;
			const height = 480;
			const keys = new Set();
			const player = { x: width / 2, y: height - 54, width: 48, height: 34, speed: 390 };
			let objects = [];
			let particles = [];
			let stars = [];
			let score = 0;
			let lives = 3;
			let timeLeft = 60;
			let spawnTimer = 0;
			let running = false;
			let paused = false;
			let lastDisplayedSecond = 60;
			let previousTime = 0;
			let animationFrame = 0;
			let best = Number(localStorage.getItem('starfall-best') || 0);

			bestDisplay.textContent = String(best).padStart(3, '0');

			function resizeCanvas() {
				const dpr = Math.min(window.devicePixelRatio || 1, 2);
				canvas.width = Math.round(width * dpr);
				canvas.height = Math.round(height * dpr);
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				stars = Array.from({ length: 85 }, (_, index) => ({
					x: (index * 137.51) % width,
					y: (index * 83.17) % height,
					radius: index % 7 === 0 ? 1.8 : 0.8,
					alpha: 0.16 + ((index * 17) % 65) / 100
				}));
			}

			function drawBackground() {
				const sky = ctx.createLinearGradient(0, 0, 0, height);
				sky.addColorStop(0, '#1b3029');
				sky.addColorStop(0.64, '#26392f');
				sky.addColorStop(1, '#543b31');
				ctx.fillStyle = sky;
				ctx.fillRect(0, 0, width, height);

				const glow = ctx.createRadialGradient(width * 0.75, height * 0.25, 4, width * 0.75, height * 0.25, 220);
				glow.addColorStop(0, '#d2d87830');
				glow.addColorStop(1, '#d2d87800');
				ctx.fillStyle = glow;
				ctx.fillRect(0, 0, width, height);

				for (const star of stars) {
					ctx.globalAlpha = star.alpha;
					ctx.fillStyle = '#f4f0d7';
					ctx.beginPath();
					ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
					ctx.fill();
				}
				ctx.globalAlpha = 1;

				ctx.fillStyle = '#c9ba7650';
				ctx.beginPath();
				ctx.moveTo(0, height - 25);
				ctx.quadraticCurveTo(width * 0.27, height - 89, width * 0.52, height - 28);
				ctx.quadraticCurveTo(width * 0.79, height - 78, width, height - 37);
				ctx.lineTo(width, height);
				ctx.lineTo(0, height);
				ctx.fill();
			}

			function drawShip() {
				ctx.save();
				ctx.translate(player.x, player.y);
				ctx.fillStyle = '#ff8064';
				ctx.beginPath();
				ctx.moveTo(-7, 12);
				ctx.lineTo(-2, 25 + Math.random() * 6);
				ctx.lineTo(3, 13);
				ctx.fill();
				ctx.fillStyle = '#d6f36a';
				ctx.beginPath();
				ctx.moveTo(0, -19);
				ctx.lineTo(24, 12);
				ctx.lineTo(12, 10);
				ctx.lineTo(0, 16);
				ctx.lineTo(-12, 10);
				ctx.lineTo(-24, 12);
				ctx.closePath();
				ctx.fill();
				ctx.fillStyle = '#f2eedf';
				ctx.beginPath();
				ctx.ellipse(0, 1, 5, 8, 0, 0, Math.PI * 2);
				ctx.fill();
				ctx.restore();
			}

			function drawObject(object) {
				ctx.save();
				ctx.translate(object.x, object.y);
				if (object.type === 'star') {
					ctx.rotate(object.spin);
					ctx.fillStyle = '#fff1a8';
					ctx.shadowColor = '#ffe37b';
					ctx.shadowBlur = 16;
					ctx.beginPath();
					for (let point = 0; point < 10; point++) {
						const radius = point % 2 === 0 ? 13 : 5.5;
						const angle = point * Math.PI / 5 - Math.PI / 2;
						const x = Math.cos(angle) * radius;
						const y = Math.sin(angle) * radius;
						if (point === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
					}
					ctx.closePath();
					ctx.fill();
				} else {
					ctx.rotate(object.spin);
					ctx.fillStyle = '#ff8064';
					ctx.beginPath();
					ctx.moveTo(-12, -9);
					ctx.lineTo(-2, -14);
					ctx.lineTo(11, -8);
					ctx.lineTo(13, 5);
					ctx.lineTo(3, 13);
					ctx.lineTo(-10, 9);
					ctx.closePath();
					ctx.fill();
					ctx.fillStyle = '#ad5547';
					ctx.beginPath();
					ctx.arc(-3, -3, 3, 0, Math.PI * 2);
					ctx.arc(6, 5, 2, 0, Math.PI * 2);
					ctx.fill();
				}
				ctx.restore();
			}

			function drawParticles() {
				for (const particle of particles) {
					ctx.globalAlpha = Math.max(0, particle.life / particle.maxLife);
					ctx.fillStyle = particle.color;
					ctx.beginPath();
					ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
					ctx.fill();
				}
				ctx.globalAlpha = 1;
			}

			function draw() {
				drawBackground();
				objects.forEach(drawObject);
				drawShip();
				drawParticles();
			}

			function updateHud() {
				scoreDisplay.textContent = String(score).padStart(3, '0');
				livesDisplay.textContent = lives > 0 ? `${'♥ '.repeat(lives).trim()}` : '—';
				const nextBest = Math.max(best, score);
				bestDisplay.textContent = String(nextBest).padStart(3, '0');
				timeDisplay.textContent = String(Math.ceil(timeLeft)).padStart(2, '0');
			}

			function burst(x, y, color) {
				for (let index = 0; index < 12; index++) {
					const angle = Math.random() * Math.PI * 2;
					const speed = 35 + Math.random() * 140;
					particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 0.45, maxLife: 0.45, radius: 1.5 + Math.random() * 2, color });
				}
			}

			function spawnObject() {
				const isStar = Math.random() < 0.69;
				objects.push({
					type: isStar ? 'star' : 'comet',
					x: 28 + Math.random() * (width - 56),
					y: -24,
					speed: 125 + Math.random() * 95 + (60 - timeLeft) * 1.1,
					spin: Math.random() * Math.PI * 2,
					spinSpeed: (Math.random() - 0.5) * 3
				});
			}

			function endGame(won) {
				running = false;
				paused = false;
				cancelAnimationFrame(animationFrame);
				pauseButton.disabled = true;
				pauseButton.textContent = 'Ⅱ';
				pauseButton.setAttribute('aria-label', 'Pause game');
				if (score > best) {
					best = score;
					localStorage.setItem('starfall-best', String(best));
				}
				updateHud();
				overlayKicker.textContent = won ? 'Shift complete' : 'Ship log · end of run';
				overlayTitle.textContent = won ? 'Lovely haul.' : 'Run over.';
				overlayCopy.textContent = `You caught ${score} ${score === 1 ? 'star' : 'stars'}.`;
				startButton.innerHTML = 'Play again <span aria-hidden="true">↗</span>';
				overlay.hidden = false;
				draw();
			}

			function step(now) {
				if (!running || paused) return;
				const delta = Math.min((now - previousTime) / 1000, 0.035);
				previousTime = now;
				timeLeft = Math.max(0, timeLeft - delta);
				const secondsRemaining = Math.ceil(timeLeft);
				if (secondsRemaining !== lastDisplayedSecond) {
					lastDisplayedSecond = secondsRemaining;
					updateHud();
				}
				player.x += ((keys.has('ArrowRight') || keys.has('d') || keys.has('D') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('a') || keys.has('A') ? 1 : 0)) * player.speed * delta;
				player.x = Math.max(28, Math.min(width - 28, player.x));

				spawnTimer -= delta;
				if (spawnTimer <= 0) {
					spawnObject();
					spawnTimer = Math.max(0.3, 0.76 - score * 0.006) + Math.random() * 0.28;
				}

				for (const object of objects) {
					object.y += object.speed * delta;
					object.spin += object.spinSpeed * delta;
					if (object.y > player.y - 10 && object.y < player.y + 18 && Math.abs(object.x - player.x) < (object.type === 'star' ? 28 : 30)) {
						object.caught = true;
						if (object.type === 'star') {
							score += 10;
							burst(object.x, object.y, '#fff1a8');
						} else {
							lives -= 1;
							burst(object.x, object.y, '#ff8064');
						}
						updateHud();
					}
				}
				objects = objects.filter(object => !object.caught && object.y < height + 30);
				for (const particle of particles) {
					particle.x += particle.vx * delta;
					particle.y += particle.vy * delta;
					particle.life -= delta;
				}
				particles = particles.filter(particle => particle.life > 0);
				draw();

				if (lives <= 0 || timeLeft <= 0) {
					endGame(timeLeft <= 0);
					return;
				}
				animationFrame = requestAnimationFrame(step);
			}

			function startGame() {
				cancelAnimationFrame(animationFrame);
				score = 0;
				lives = 3;
				timeLeft = 60;
				lastDisplayedSecond = 60;
				spawnTimer = 0.2;
				objects = [];
				particles = [];
				player.x = width / 2;
				running = true;
				paused = false;
				previousTime = performance.now();
				overlay.hidden = true;
				pauseButton.disabled = false;
				pauseButton.textContent = 'Ⅱ';
				pauseButton.setAttribute('aria-label', 'Pause game');
				overlayCopy.textContent = 'Catch the stars. Keep your hull in one piece.';
				updateHud();
				animationFrame = requestAnimationFrame(step);
			}

			startButton.addEventListener('click', () => {
				if (!paused) {
					startGame();
					return;
				}
				overlay.hidden = true;
				paused = false;
				startButton.innerHTML = 'Start game <span aria-hidden="true">↗</span>';
				previousTime = performance.now();
				animationFrame = requestAnimationFrame(step);
			});
			pauseButton.addEventListener('click', () => {
				if (!running) return;
				paused = !paused;
				pauseButton.textContent = paused ? '▶' : 'Ⅱ';
				pauseButton.setAttribute('aria-label', paused ? 'Resume game' : 'Pause game');
				if (paused) {
					overlayKicker.textContent = 'A moment between stars';
					overlayTitle.textContent = 'Paused';
					overlayCopy.textContent = `Score ${score} · ${Math.ceil(timeLeft)} seconds left`;
					startButton.innerHTML = 'Resume <span aria-hidden="true">↗</span>';
					overlay.hidden = false;
				} else {
					overlay.hidden = true;
					  startButton.innerHTML = 'Start game <span aria-hidden="true">↗</span>';
					previousTime = performance.now();
					animationFrame = requestAnimationFrame(step);
				}
			});

			window.addEventListener('keydown', event => {
				if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
				keys.add(event.key);
				if (event.key === ' ' && running && !event.repeat) pauseButton.click();
			});
			window.addEventListener('keyup', event => keys.delete(event.key));
			window.addEventListener('blur', () => keys.clear());

			document.querySelectorAll('.mobile-controls button').forEach(button => {
				const direction = button.dataset.dir === '1' ? 'ArrowRight' : 'ArrowLeft';
				button.addEventListener('pointerdown', event => { event.preventDefault(); keys.add(direction); });
				for (const eventName of ['pointerup', 'pointercancel', 'pointerleave']) {
					button.addEventListener(eventName, () => keys.delete(direction));
				}
			});

			new ResizeObserver(resizeCanvas).observe(stage);
			resizeCanvas();
			draw();
		})();
	</script>
</body>
</html>
